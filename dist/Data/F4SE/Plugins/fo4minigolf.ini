; fo4minigolf: read when the game's data loads and again at the start of every round.

[Keys]
; virtual-key codes (https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes)
iPlay=0x67         ; Numpad 7: start a round on the nearest course (activating the course does it too)
iLeave=0x58        ; X: end the round
iOverhead=0x51     ; Q: the view from above the hole (the right mouse button does it too)

[Putting]
fPullPerCount=0.0035   ; the putt's power per mouse count pulled back (bigger: less pull for full power)
bInvertPull=0          ; 1: push the mouse forward for power instead
fPowerCurve=1.5        ; power to speed: speed = max * power ^ this (bigger: finer soft putts)
iMaxStrokes=6          ; a hole's over at this many strokes, scored as this many
bGuide=1               ; dots showing where the putt goes
fGuideLength=120       ; ...how far ahead (game units, about 70 a metre)

[Camera]
fDistance=85       ; behind the ball
fPitch=28          ; degrees down, to start with
fMinPitch=6
fMaxPitch=75

[Sound]
bSound=1
fVolume=0.8

[Physics]
fRollDecel=38      ; rolling resistance on the carpet (bigger: slower greens)
fMaxSpeed=420      ; full power, units a second
fLandBounce=0.35   ; how much a ball bounces landing from a jump
