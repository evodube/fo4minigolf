name: tests

on:
  push:
  pull_request:

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Physics tests and the course played by the bot
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/sim_test.cpp src/sim/Sim.cpp src/sim/Course.cpp -o sim_test
          ./sim_test dist/Data/F4SE/Plugins/fo4minigolf/course.txt
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/course_play.cpp src/sim/Sim.cpp src/sim/Course.cpp src/sim/Bot.cpp -o course_play
          ./course_play dist/Data/F4SE/Plugins/fo4minigolf/course.txt
